<style>

.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:6px 12px}
.bar.on{border-color:var(--ac);box-shadow:0 0 14px rgba(234,179,8,.3)}
.who{display:flex;align-items:center;gap:10px;min-width:0}

.av.ai{background:linear-gradient(135deg,#a855f7,#6b21a8)}
.nm{font-size:.9rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap{display:flex;align-items:center;min-height:16px;direction:ltr}
.cap svg{width:16px;height:16px;margin-right:-5px}
.cap em{font-style:normal;font-size:.7rem;font-weight:700;color:#fde047;margin-left:9px}
.clk{font:900 1.2rem/1 'Courier New',monospace;background:rgba(0,0,0,.45);padding:6px 11px;border-radius:9px}
.clk.low{color:#ef4444;animation:pl 1s infinite}@keyframes pl{50%{opacity:.5}}
.bw{display:flex;gap:8px;direction:ltr}
#ev{width:14px;height:var(--bs);flex:none;background:#f1f5f9;border-radius:7px;overflow:hidden;border:2px solid rgba(255,255,255,.15);display:flex;flex-direction:column}
#ev.fp{flex-direction:column-reverse}

#board{width:var(--bs);height:var(--bs);direction:ltr;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border:5px solid #1e293b;border-radius:10px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.6);touch-action:none}
.sq{position:relative;display:grid;place-items:center;cursor:pointer;min-width:0;min-height:0}
.lt{background:var(--lt)}.dk{background:var(--dk)}
.sq::before{content:"";position:absolute;inset:0;pointer-events:none}
.last::before{background:rgba(255,235,60,.45)}
.sel::before{background:rgba(125,200,40,.55)}
.hint::before{background:rgba(59,130,246,.6)}
.chk::before{background:radial-gradient(circle,rgba(239,68,68,.95),rgba(220,38,38,.55) 60%,transparent 100%)}
.ov{box-shadow:inset 0 0 0 3px var(--ac)}
.pc{width:88%;height:88%;pointer-events:none;z-index:2;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.pc.gh{opacity:.25}

.ghost{position:fixed;left:0;top:0;z-index:200;pointer-events:none;width:calc(var(--bs)/8*1.3);height:calc(var(--bs)/8*1.3);transform:translate(-50%,-62%)}
.dot,.ring{position:absolute;border-radius:50%;pointer-events:none;z-index:3}
.dot{width:28%;height:28%;background:rgba(0,0,0,.25)}

.co{position:absolute;font:800 clamp(8px,1.8vmin,11px) sans-serif;pointer-events:none;opacity:.9;z-index:1}
.lt .co{color:var(--dk)}.dk .co{color:var(--lt)}
.rk{top:2px;left:3px}.fl{bottom:1px;right:3px}

  for(let d=1;d<=L[0]&&!stop;d++){
   let a=-BIG,cm=null,cv=-BIG;
   for(const m of root){
    g.move(m);
    const v=g.in_draw()?0:-s(g,d-1,-BIG,-a,1);
    g.undo();
    if(stop)break;
    const j=v+(Math.random()-.5)*L[2];
    if(j>cv){cv=j;cm=m;a=cv-L[2]}}
   if(!stop&&cm){best=cm;bv=cv;root=[cm].concat(root.filter(x=>x!==cm))}
   if(Math.abs(bv)>98000)break}
  postMessage({type,best:{from:best.from,to:best.to,promotion:best.promotion},nodes,ms:Math.round(performance.now()-t0),score:bv*(g.turn()==='w'?1:-1)})}
}
const WSRC='try{importScripts("https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js")}catch(e){importScripts("https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js")};('+workerMain+')()';

/* ---------- الحالة ---------- */
const game=new Chess();
const S={sel:null,legal:[],last:null,hint:null,flip:false,think:false,hq:false,timeout:false,shown:false,drag:null,score:null,mat:0,wt:0,bt:0,tick:0,req:'',msg:''};
let W=null,WU=null;
const board=$('board'),mode=()=>$('mode').value,me=()=>$('color').value,limit=()=>+$('time').value;
const aiTurn=()=>mode()==='ai'&&game.turn()!==me();
const over=()=>S.timeout||game.game_over();
const canMove=()=>!over()&&!S.think&&!aiTurn();
const inProg=()=>game.history().length>0&&!over();
const clearSel=()=>{S.sel=null;S.legal=[]};
const spin=()=>$('think').classList.toggle('on',S.think||S.hq);

function newWorker(){
 if(W)W.terminate();if(WU)URL.revokeObjectURL(WU);
 WU=URL.createObjectURL(new Blob([WSRC],{type:'text/javascript'}));
 W=new Worker(WU);W.onmessage=onRes;
 W.onerror=()=>{S.think=S.hq=false;spin();$('st').textContent='⚠️ تعذّر تشغيل المحرك — تحقق من الإنترنت'};
 S.think=S.hq=false;spin()}
function ask(type,lvl){
 if(type==='hint')S.hq=true;else S.think=true;
 S.req=game.fen();spin();
 W.postMessage({type,level:lvl,moves:game.history({verbose:true}).map(m=>({from:m.from,to:m.to,promotion:m.promotion}))})}
function onRes(e){
 const r=e.data;if(r.type==='hint')S.hq=false;else S.think=false;spin();
 if(S.req!==game.fen()||over()||!r.best)return;
 $('nodes').textContent=r.nodes.toLocaleString();$('tm').textContent=r.ms+' ms';
 if(r.type==='hint'){S.hint=r.best;render();return}
 setTimeout(()=>{if(S.req===game.fen()&&!over()){exec(r.best);S.score=r.score;ui()}},Math.max(0,350-r.ms))}

/* ---------- الرسم ---------- */
function render(){
 const b=game.board(),f=S.flip,d=S.drag&&S.drag.on?S.drag.sq:null,ck=game.in_check();let h='';
 for(let i=0;i<8;i++)for(let j=0;j<8;j++){
  const r=f?7-i:i,c=f?7-j:j,sq=F[c]+(8-r),p=b[r][c],lm=S.legal.find(m=>m.to===sq);
  let k='sq '+((r+c)%2?'dk':'lt');
  if(S.last&&(S.last.from===sq||S.last.to===sq))k+=' last';
  if(S.sel===sq)k+=' sel';
  if(S.hint&&(S.hint.from===sq||S.hint.to===sq))k+=' hint';
  if(ck&&p&&p.type==='k'&&p.color===game.turn())k+=' chk';
  h+=`<div class="${k}" data-sq="${sq}">${j===0?`<i class="co rk">${8-r}</i>`:''}${i===7?`<i class="co fl">${F[c]}</i>`:''}${p?`<div class="pc${d===sq?' gh':''}">${SVG(p.color,p.type)}</div>`:''}${lm?`<b class="${p||lm.flags.includes('e')?'ring':'dot'}"></b>`:''}</div>`}
 board.innerHTML=h}

function play(mv){
 if(mv.flags.includes('p')){render();promo(mv)}else exec({from:mv.from,to:mv.to})}
function exec(m){
 if(S.hq)newWorker();
 tickClock();const r=game.move(m);if(!r)return;
 clearSel();S.last={from:r.from,to:r.to};S.hint=null;S.score=null;S.tick=performance.now();
 if(game.game_over())snd.end();else if(game.in_check())snd.chk();else if(r.captured)snd.cap();else snd.move();
 render();ui();
 if(!over()&&aiTurn())ask('ai',+$('lvl').value)}
function promo(mv){
 const c=game.turn(),box=$('pch');box.innerHTML='';
 ['q','r','b','n'].forEach(t=>{const b=document.createElement('button');b.className='pb';b.innerHTML=SVG(c,t);
  b.onclick=()=>{$('promo').classList.remove('on');exec({from:mv.from,to:mv.to,promotion:t})};box.appendChild(b)});
 $('promo').classList.add('on')}
$('promo').onclick=e=>{if(e.target===e.currentTarget){e.currentTarget.classList.remove('on');clearSel();render()}};

/* ---------- اللمس والماوس: نقر للتحريك + سحب وإفلات ---------- */
board.addEventListener('contextmenu',e=>e.preventDefault());
board.addEventListener('pointerdown',e=>{
 if(e.button>0||!e.isPrimary||S.drag||!canMove())return;
 const el=e.target.closest('.sq');if(!el)return;
 const sq=el.dataset.sq,mv=S.legal.find(m=>m.to===sq),p=game.get(sq),was=S.sel===sq;
 if(mv){play(mv);return}
 if(p&&p.color===game.turn()){
  S.sel=sq;S.legal=game.moves({square:sq,verbose:true});render();
  S.drag={sq,p,x:e.clientX,y:e.clientY,on:false,was,id:e.pointerId,g:null,t:null};
  try{board.setPointerCapture(e.pointerId)}catch(_){}
 }else{clearSel();render()}});
board.addEventListener('pointermove',e=>{
 const d=S.drag;if(!d||e.pointerId!==d.id)return;
 if(!d.on&&Math.hypot(e.clientX-d.x,e.clientY-d.y)>7)d.on=true;
 if(!d.on)return;
 if(!d.g){d.g=document.createElement('div');d.g.className='ghost';d.g.innerHTML=SVG(d.p.color,d.p.type);document.body.appendChild(d.g);
  const pc=board.querySelector(`[data-sq="${d.sq}"] .pc`);if(pc)pc.classList.add('gh')}
 d.g.style.left=e.clientX+'px';d.g.style.top=e.clientY+'px';
 const t=document.elementFromPoint(e.clientX,e.clientY),sq=t&&t.closest('.sq');
 if(sq!==d.t){if(d.t)d.t.classList.remove('ov');d.t=sq;if(sq&&S.legal.some(m=>m.to===sq.dataset.sq))sq.classList.add('ov')}});
const endDrag=e=>{
 const d=S.drag;if(!d||e.pointerId!==d.id)return;S.drag=null;
 if(d.g)d.g.remove();if(d.t)d.t.classList.remove('ov');
 if(e.type==='pointerup'){
  if(d.on){const t=document.elementFromPoint(e.clientX,e.clientY),sq=t&&t.closest('.sq'),mv=sq&&S.legal.find(m=>m.to===sq.dataset.sq);if(mv){play(mv);return}}
  else if(d.was)clearSel()}
 render()};
board.addEventListener('pointerup',endDrag);board.addEventListener('pointercancel',endDrag);

/* ---------- الواجهة ---------- */
function heads(){
 const bc=S.flip?'b':'w',tc=bc==='w'?'b':'w',ai=mode()==='ai',lv=$('lvl').selectedOptions[0].textContent;
 const info=c=>{const n=c==='w'?'الأبيض':'الأسود';return ai?(c===me()?['أنت ('+n+')','👤',0]:['المحرك — '+lv,'🤖',1]):['اللاعب ('+n+')','👤',0]};
 [['t',tc],['b',bc]].forEach(([k,c])=>{const[n,a,x]=info(c);$(k+'n').textContent=n;$(k+'a').textContent=a;$(k+'a').classList.toggle('ai',!!x)})}
function caps(){
 const val={p:1,n:3,b:3,r:5,q:9},cw=[],cb=[];let mat=0;
 game.board().forEach(r=>r.forEach(p=>{if(p&&p.type!=='k')mat+=(p.color==='w'?1:-1)*val[p.type]}));
 game.history({verbose:true}).forEach(m=>{if(m.captured)(m.color==='w'?cw:cb).push(m.captured)});
 const o='qrbnp',h=(a,col,adv)=>a.sort((x,y)=>o.indexOf(x)-o.indexOf(y)).map(t=>SVG(col,t)).join('')+(adv>0?`<em>+${adv}</em>`:'');
 const wh=h(cw,'b',mat),bl=h(cb,'w',-mat);
 $('tcp').innerHTML=S.flip?wh:bl;$('bcp').innerHTML=S.flip?bl:wh;S.mat=mat*100}
function fin(t,m){if(S.shown)return;S.shown=true;$('gt').textContent=t;$('gm').textContent=m;$('over').classList.add('on')}
function ui(){
 let txt;
 if(S.timeout)txt=S.msg;
 else if(game.in_checkmate()){txt='كش مات! فاز '+(game.turn()==='w'?'الأسود':'الأبيض');fin('🏆 كش مات',txt)}
 else if(game.in_draw()){txt=game.in_stalemate()?'تعادل بالحصر':game.in_threefold_repetition()?'تعادل بتكرار الوضعية':game.insufficient_material()?'تعادل لعدم كفاية القطع':'تعادل (قاعدة الخمسين نقلة)';fin('🤝 تعادل',txt)}
 else txt='دور '+(game.turn()==='w'?'الأبيض':'الأسود')+(game.in_check()?' — كش! ⚠️':'');
 $('st').textContent=txt;
 const top=S.flip?'w':'b';
 $('tb').classList.toggle('on',!over()&&game.turn()===top);$('bb').classList.toggle('on',!over()&&game.turn()!==top);
 caps();
 let sc=S.score!=null?S.score:S.mat;
 if(game.in_checkmate())sc=game.turn()==='w'?-99999:99999;
 $('evb').style.height=(100-(50+50*Math.tanh(sc/400)))+'%';
 $('evt').textContent=Math.abs(sc)>90000?'M':(sc>0?'+':'')+(sc/100).toFixed(1);
 $('fen').value=game.fen();
 const mv=game.history();let h='';
 for(let i=0;i<mv.length;i+=2)h+=`<div class="mr"><span>${i/2+1}.</span><span>${mv[i]}</span><span>${mv[i+1]||''}</span></div>`;
 $('hist').innerHTML=h;$('hist').scrollTop=1e6}

/* ---------- الساعة (تبدأ بعد أن يلعب الطرفان نقلة واحدة) ---------- */
const running=()=>limit()>0&&!over()&&game.history().length>=2;
function clocks(){
 const t=limit(),f=ms=>{const s=Math.ceil(ms/1000);return String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
 const tm=S.flip?S.wt:S.bt,bm=S.flip?S.bt:S.wt;
 $('tk').textContent=t?f(tm):'∞';$('bk').textContent=t?f(bm):'∞';
 $('tk').classList.toggle('low',!!t&&tm>0&&tm<=30000);$('bk').classList.toggle('low',!!t&&bm>0&&bm<=30000)}
function tickClock(){
 const n=performance.now(),d=n-S.tick;S.tick=n;
 if(running()){
  if(game.turn()==='w'){S.wt=Math.max(0,S.wt-d);if(!S.wt)timeout('w')}
  else{S.bt=Math.max(0,S.bt-d);if(!S.bt)timeout('b')}}
 clocks()}
function timeout(c){
 if(S.timeout)return;S.timeout=true;newWorker();
 const o=c==='w'?'b':'w',mm=game.board().flat().filter(p=>p&&p.color===o&&p.type!=='k');
 const lone=!mm.length||(mm.length===1&&(mm[0].type==='n'||mm[0].type==='b'));
 S.msg=lone?'انتهى الوقت — تعادل (الخصم لا يملك قطعًا كافية للكش مات)':'انتهى الوقت! فاز '+(o==='w'?'الأبيض':'الأسود');
 snd.end();ui();fin(lone?'🤝 تعادل':'⏰ انتهى الوقت',S.msg)}

/* ---------- بدء المباراة والتحكم ---------- */
function initGame(){
 newWorker();game.reset();
 Object.assign(S,{sel:null,legal:[],last:null,hint:null,timeout:false,shown:false,score:null,drag:null});
 clearSel();
 $('gl').style.display=$('gc').style.display=mode()==='ai'?'':'none';
 S.flip=mode()==='ai'&&me()==='b';S.wt=S.bt=limit()*1000;S.tick=performance.now();
 document.querySelectorAll('.mo').forEach(m=>m.classList.remove('on'));
 $('ev').classList.toggle('fp',S.flip);heads();clocks();render();ui();
 if(aiTurn())ask('ai',+$('lvl').value)}
function confirmBox(msg){return new Promise(res=>{
 $('dm').textContent=msg;$('dlg').classList.add('on');
 $('dy').onclick=()=>{$('dlg').classList.remove('on');res(true)};
 $('dn').onclick=()=>{$('dlg').classList.remove('on');res(false)}})}

$('nb').onclick=async()=>{if(inProg()&&!await confirmBox('إنهاء المباراة الحالية وبدء مباراة جديدة؟'))return;initGame()};
$('again').onclick=initGame;
$('rv').onclick=()=>$('over').classList.remove('on');
$('ub').onclick=()=>{
 if(S.timeout||!game.history().length)return;
 if(mode()==='ai'&&me()==='b'&&game.history().length<2)return;
 newWorker();
 if(mode()==='ai'){do{if(!game.undo())break}while(game.turn()!==me())}else game.undo();
 clearSel();S.hint=null;S.score=null;S.shown=false;S.tick=performance.now();
 $('over').classList.remove('on');
 const h=game.history({verbose:true}),l=h[h.length-1];S.last=l?{from:l.from,to:l.to}:null;
 render();ui();if(!over()&&aiTurn())ask('ai',+$('lvl').value)};
$('hb').onclick=()=>{if(canMove()&&!S.hq)ask('hint',3)};
$('fb').onclick=()=>{S.flip=!S.flip;$('ev').classList.toggle('fp',S.flip);heads();clocks();render();ui()};
$('sb').onclick=()=>{snd.on=!snd.on;$('sb').textContent=snd.on?'🔊 الصوت':'🔇 مكتوم';save()};
$('cf').onclick=async()=>{const i=$('fen');try{await navigator.clipboard.writeText(i.value)}catch(_){i.select();document.execCommand('copy')}
 $('cf').textContent='✅';setTimeout(()=>$('cf').textContent='📋',1200)};

const KEYS=['mode','lvl','color','time','theme'];
function save(){try{const o={snd:snd.on};KEYS.forEach(k=>o[k]=$(k).value);localStorage.setItem('chess3',JSON.stringify(o))}catch(_){}}
function load(){try{const o=JSON.parse(localStorage.getItem('chess3')||'{}');
 KEYS.forEach(k=>{if(o[k]!=null&&[...$(k).options].some(x=>x.value===o[k]))$(k).value=o[k]});
 if(o.snd===false){snd.on=false;$('sb').textContent='🔇 مكتوم'}}catch(_){}
 theme()}
function theme(){const v=$('theme').value;v==='classic'?document.documentElement.removeAttribute('data-theme'):document.documentElement.setAttribute('data-theme',v)}
$('theme').onchange=()=>{theme();save()};
$('lvl').onchange=()=>{heads();save()};

load();
['mode','color','time'].forEach(id=>{const el=$(id);el._p=el.value;
 el.onchange=async()=>{
  if(inProg()&&!await confirmBox('تغيير هذا الإعداد سيبدأ مباراة جديدة. متأكد؟')){el.value=el._p;return}
  el._p=el.value;save();initGame()}});
initGame();setInterval(tickClock,100);
</script>
