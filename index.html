  <body>
    <div id="app">
      <div id="pixi-container"></div>
    </div>

    <!-- Intro page shown before the game. Hidden unless the query param is
         present; main.ts wires the button to start the game on click. -->
    <div
      id="intro"
      class="fixed inset-0 hidden items-center justify-center text-on-surface"
    >
      <!-- Keys are co-located on the elements via data-i18n; the inline script
           below fills them synchronously from the build-time injected map. -->
      <div
        class="flex flex-col gap-md text-center p-md size-full max-w-[560px]"
      >
        <div class="flex-1 flex flex-col items-center justify-center gap-sm">
          <img
            class="w-[140px]"
            src="opera-cat.png"
            alt=""
            style="image-rendering: pixelated"
          />
          <h1 data-i18n="onboarding_title" class="text-title-lg"></h1>
          <p data-i18n="onboarding_desc" class="text-body-md"></p>
        </div>
        <button
          data-i18n="start_game"
          type="button"
          class="text-label-lg text-on-primary bg-primary w-full p-sm rounded-full"
        ></button>
      </div>
    </div>
    <script>
      // Reveal and translate the intro page before first paint (flash-free)
      // when the param is set. Runs synchronously during parse, after #intro
      // and the injected #intro-i18n map, and before the deferred game module.
      if (new URLSearchParams(location.search).get("intro") === "true") {
        const intro = document.getElementById("intro");
        // Swap `hidden` for `flex` so the centering utilities take effect.
        intro.classList.remove("hidden");
        intro.classList.add("flex");

        // Fill the copy from the build-time map, picking the visitor's language
        // (with the same en-US fallback as the runtime i18n). No fetch, so the
        // correct language is present immediately.
        const map = document.getElementById("intro-i18n");
        const all = map ? JSON.parse(map.textContent) : {};
        const lang = navigator.language.toLowerCase();
        const dict =
          all[lang] ||
          all[lang.split("-")[0]] ||
          (lang.startsWith("zh") ? all["zh-cn"] : null) ||
          all["en-us"] ||
          {};
        for (const el of intro.querySelectorAll("[data-i18n]")) {
          const value = dict[el.getAttribute("data-i18n")];
          if (!value) continue;
          // Render <bold>..</bold> markup as real <strong> nodes. Every other
          // segment is set as text, so untrusted markup can never be injected.
          el.replaceChildren();
          value.split(/<\/?bold>/).forEach((part, i) => {
            if (i % 2 === 1) {
              const strong = document.createElement("strong");
              strong.textContent = part;
              el.append(strong);
            } else if (part) {
              el.append(part);
            }
          });
        }
      }
    </script>
